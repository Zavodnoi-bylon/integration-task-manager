name: integration-task-manager-staging

x-database-environment: &database-environment
  DATABASE_BACKEND: postgres
  TICKETING_DB_HOST: postgres
  TICKETING_DB_PORT: "5432"
  TICKETING_DB_NAME: task_manager_staging
  TICKETING_DB_USER: task_manager_staging
  TICKETING_DB_PASSWORD: ${STAGING_DB_PASSWORD:?set STAGING_DB_PASSWORD}

x-miniapp-environment: &miniapp-environment
  DATABASE_URL: postgresql://task_manager_staging:${STAGING_DB_PASSWORD}@postgres:5432/task_manager_staging
  DATABASE_MIGRATION_URL: postgresql://task_manager_staging:${STAGING_DB_PASSWORD}@postgres:5432/task_manager_staging
  FORWARDED_ALLOW_IPS: "*"

x-app-runtime: &app-runtime
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  networks: [database, egress]
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "2"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_manager_staging
      POSTGRES_USER: task_manager_staging
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?set STAGING_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_manager_staging -d task_manager_staging"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [database]
    mem_limit: 320m
    cpus: 0.40
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  canonical-migrate:
    image: integration-task-manager:${STAGING_IMAGE_TAG:-staging}
    build:
      context: .
      target: test
    environment:
      DATABASE_MIGRATION_URL: postgresql://task_manager_staging:${STAGING_DB_PASSWORD}@postgres:5432/task_manager_staging
    command: ["python", "/app/scripts/migrate_postgres.py"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [database]
    mem_limit: 192m

  mini-migrate:
    image: dest-bot-miniapp:${STAGING_IMAGE_TAG:-staging}
    build:
      context: ./services/task-miniapp
      target: production
      additional_contexts:
        canonical: .
    environment:
      <<: *miniapp-environment
    command: ["python", "/app/scripts/migrate_postgres.py"]
    depends_on:
      canonical-migrate: {condition: service_completed_successfully}
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [database]
    mem_limit: 192m

  aio-advertiser-sync:
    <<: *app-runtime
    image: integration-task-manager:${STAGING_IMAGE_TAG:-staging}
    profiles: [aio-advertisers]
    env_file:
      - "${STAGING_CONFIG_DIR:?set STAGING_CONFIG_DIR}/aio-advertisers.env"
    environment:
      DATABASE_URL: postgresql://task_manager_staging:${STAGING_DB_PASSWORD}@postgres:5432/task_manager_staging
    command: ["python", "-m", "app.workers.aio_advertisers"]
    depends_on:
      mini-migrate: {condition: service_completed_successfully}
    mem_limit: 192m
    cpus: 0.25

  kalisto-bot:
    <<: *app-runtime
    image: integration-task-manager:${STAGING_IMAGE_TAG:-staging}
    profiles: [kalisto]
    env_file: ["${STAGING_CONFIG_DIR:?set STAGING_CONFIG_DIR}/kalisto.env"]
    environment:
      <<: *database-environment
    command: ["python", "/app/main.py"]
    depends_on:
      mini-migrate: {condition: service_completed_successfully}
    mem_limit: 160m
    cpus: 0.35

  kalisto-web:
    <<: *app-runtime
    image: dest-bot-miniapp:${STAGING_IMAGE_TAG:-staging}
    profiles: [kalisto]
    env_file: ["${STAGING_CONFIG_DIR:?set STAGING_CONFIG_DIR}/kalisto.env"]
    environment:
      <<: *miniapp-environment
    command: ["python", "-m", "dest_miniapp.runtime", "web"]
    depends_on:
      mini-migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:18765:8000"]
    healthcheck:
      test: ["CMD", "python", "-m", "dest_miniapp.runtime", "health-web"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 160m
    cpus: 0.35

  kalisto-worker:
    <<: *app-runtime
    image: dest-bot-miniapp:${STAGING_IMAGE_TAG:-staging}
    profiles: [kalisto]
    env_file: ["${STAGING_CONFIG_DIR:?set STAGING_CONFIG_DIR}/kalisto.env"]
    environment:
      <<: *miniapp-environment
    command: ["python", "-m", "dest_miniapp.runtime", "worker"]
    depends_on:
      mini-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-m", "dest_miniapp.runtime", "health-worker"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: 160m
    cpus: 0.30

  kalisto-tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [kalisto]
    command: ["tunnel", "--no-autoupdate", "--url", "http://kalisto-web:8000"]
    depends_on:
      kalisto-web: {condition: service_healthy}
    restart: unless-stopped
    networks: [egress]
    mem_limit: 96m
    cpus: 0.15
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  mephisto-bot:
    <<: *app-runtime
    image: integration-task-manager:${STAGING_IMAGE_TAG:-staging}
    profiles: [mephisto]
    env_file: ["${STAGING_CONFIG_DIR:?set STAGING_CONFIG_DIR}/mephisto.env"]
    environment:
      <<: *database-environment
    command: ["python", "/app/main.py"]
    depends_on:
      mini-migrate: {condition: service_completed_successfully}
    mem_limit: 160m
    cpus: 0.35

  mephisto-web:
    <<: *app-runtime
    image: dest-bot-miniapp:${STAGING_IMAGE_TAG:-staging}
    profiles: [mephisto]
    env_file: ["${STAGING_CONFIG_DIR:?set STAGING_CONFIG_DIR}/mephisto.env"]
    environment:
      <<: *miniapp-environment
    command: ["python", "-m", "dest_miniapp.runtime", "web"]
    depends_on:
      mini-migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:18766:8000"]
    healthcheck:
      test: ["CMD", "python", "-m", "dest_miniapp.runtime", "health-web"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 160m
    cpus: 0.35

  mephisto-worker:
    <<: *app-runtime
    image: dest-bot-miniapp:${STAGING_IMAGE_TAG:-staging}
    profiles: [mephisto]
    env_file: ["${STAGING_CONFIG_DIR:?set STAGING_CONFIG_DIR}/mephisto.env"]
    environment:
      <<: *miniapp-environment
    command: ["python", "-m", "dest_miniapp.runtime", "worker"]
    depends_on:
      mini-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-m", "dest_miniapp.runtime", "health-worker"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: 160m
    cpus: 0.30

  mephisto-tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [mephisto]
    command: ["tunnel", "--no-autoupdate", "--url", "http://mephisto-web:8000"]
    depends_on:
      mephisto-web: {condition: service_healthy}
    restart: unless-stopped
    networks: [egress]
    mem_limit: 96m
    cpus: 0.15
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  postgres-data:

networks:
  database:
    internal: true
  egress:
    driver: bridge
