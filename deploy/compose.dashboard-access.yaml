# Standalone proxy for the new VPS trial dashboard; run as administrator.
# Supply -p team-activity-access and this file explicitly.
services:
  caddy:
    image: caddy:2@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    restart: unless-stopped
    network_mode: host
    env_file:
      - /etc/team-activity-access/access.env
    volumes:
      - /etc/team-activity-access/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  caddy_data:
  caddy_config:
